[package]
name = "roneyview"
version = "0.6.8"
edition = "2021"
rust-version = "1.88"
description = "Image viewer; not only for picture, you can see a folder with pictures, archive with pictures, and comic files like CBZ"
license = "MIT"

[features]
# dialogs: dialog berkas GTK3            (butuh libgtk-3-dev saat kompilasi)
# heif:    AVIF + HEIC/HEIF lewat libheif (butuh libheif-dev >= 1.17)
# rar:     arsip RAR/CBR lewat unrar      (butuh g++, sudah ada di build-essential)
# Bangun tanpa semuanya:  cargo build --release --no-default-features
default = ["dialogs", "heif", "rar"]
dialogs = ["dep:rfd"]
heif = ["dep:libheif-rs"]
rar = ["dep:unrar"]

[dependencies]
eframe = { version = "=0.33.3", default-features = false, features = ["glow", "x11", "wayland", "default_fonts"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "tiff", "qoi", "tga", "ico"] }
zip = { version = "8", default-features = false, features = ["deflate"] }
# Resize SIMD ~20x lebih cepat daripada `image::imageops::resize` untuk
# foto besar (murni Rust, tanpa dependensi sistem). Fitur `image` memberi
# integrasi langsung dengan `DynamicImage`, dengan fallback ke resize
# bawaan `image` bila tipe piksel tidak didukung.
fast_image_resize = { version = "6", features = ["image"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = { version = "0.15", default-features = false, features = ["gtk3"], optional = true }
libheif-rs = { version = "2", default-features = false, features = ["v1_17"], optional = true }
unrar = { version = "0.5", optional = true }
trash = { version = "5", default-features = false }
libc = "0.2"
x11rb = { version = "0.13", default-features = false, features = ["randr"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

# Dekoder gambar sangat dipengaruhi optimasi; pakai opt-level tinggi juga saat debug
# supaya `cargo run` tidak terasa lambat.
[profile.dev.package."*"]
opt-level = 2
